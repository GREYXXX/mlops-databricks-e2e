resources:
  jobs:
    mlops_e2e_newsgroups_pipeline:
      name: "[${bundle.target}] MLOps E2E Newsgroups Ensemble Pipeline"
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: America/Los_Angeles
      tasks:
        - task_key: data_preparation
          notebook_task:
            notebook_path: ../notebooks/newsgroups/01_data_preparation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: ensemble_env

        - task_key: feature_engineering
          depends_on:
            - task_key: data_preparation
          notebook_task:
            notebook_path: ../notebooks/newsgroups/02_feature_engineering.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: ensemble_env

        - task_key: ensemble_training
          depends_on:
            - task_key: feature_engineering
          notebook_task:
            notebook_path: ../notebooks/newsgroups/03_ensemble_training.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: ensemble_env

        - task_key: model_evaluation
          depends_on:
            - task_key: ensemble_training
          notebook_task:
            notebook_path: ../notebooks/newsgroups/04_model_evaluation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: ensemble_env

        - task_key: model_registration
          depends_on:
            - task_key: model_evaluation
          notebook_task:
            notebook_path: ../notebooks/newsgroups/05_model_registration.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: ${var.ensemble_model_name}
          environment_key: ensemble_env

        - task_key: champion_management
          depends_on:
            - task_key: model_registration
          notebook_task:
            notebook_path: ../notebooks/newsgroups/06_champion_management.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: ${var.ensemble_model_name}
          environment_key: ensemble_env

      environments:
        - environment_key: ensemble_env
          spec:
            client: "4"
            dependencies:
              - scikit-learn>=1.3.0
              - gensim>=4.3.0
              - torch>=2.1.0
              - pytorch-lightning>=2.1.0
              - ../dist/mlops_e2e-0.2.0-py3-none-any.whl
