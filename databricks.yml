bundle:
  name: mlops_e2e_example

variables:
  catalog:
    description: Unity Catalog catalog name
    default: main
  schema:
    description: Unity Catalog schema name
    default: mlops_e2e
  model_name:
    description: Registered model name
    default: california_housing_model
  warehouse_id:
    description: SQL warehouse ID for app queries

sync:
  include:
    - app/frontend/dist/**

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

artifacts:
  mlops_e2e_wheel:
    type: whl
    path: .
    build: python setup.py bdist_wheel

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    presets:
      name_prefix: "[dev ${workspace.current_user.short_name}] "
    variables:
      catalog: workspace
      schema: mlops_e2e
      warehouse_id: "77ed47464d3a24e5"

  staging:
    variables:
      catalog: staging_catalog
      schema: mlops_e2e

  prod:
    mode: production
    variables:
      catalog: prod_catalog
      schema: mlops_e2e
    run_as:
      service_principal_name: mlops-e2e-sp
