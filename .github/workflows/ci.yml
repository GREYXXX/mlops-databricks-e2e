name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests app/backend setup.py

      - name: Ruff format
        run: ruff format --check src tests app/backend setup.py

      - name: Pytest
        run: pytest tests/
